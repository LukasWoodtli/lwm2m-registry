[package]
name = "lwm2m-registry"
description = "A simple registry for LwM2M specification files."
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/LukasWoodtli/lwm2m-registry"

[dependencies]
serde-xml-rs = "0.6.0"
serde = { version = "1.0.215", features = ["derive"] }
tokio = { version = "1.4.11", features = ["fs", "io-util", "macros", "rt"] }
anyhow = "1.0.93"
walkdir = "2.5"

[dev-dependencies]
tokio-test = "0.4.4"

[package.metadata.cargo-machete]
# tokio-test is only used in doctests, which cargo-machete does not scan
ignored = ["tokio-test"]
