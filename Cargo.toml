[package]
name = "lwm2m-registry"
description = "A simple registry for LwM2M specification files."
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/LukasWoodtli/lwm2m-registry"

[dependencies]
serde-xml-rs = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "rt"] }
anyhow = "1.0.103"
log = "0.4"
walkdir = "2.5"
